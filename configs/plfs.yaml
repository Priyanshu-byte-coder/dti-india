# PLFS harmonisation. One entry per round; every round maps its raw column names to
# the standard names used by the code (left side). Fill `columns` after opening the
# round's person-level first-visit file and its data layout. Codes below follow the
# PLFS instruction manuals; check them against each round's manual before the run.
#
# Standard names
#   required: state, sector, sex, age, cws_status, occ3, nic, gen_edu, mult
#   optional: district, fsu, stratum, quarter, visit, nss, nsc, no_qtr, marital, social_group,
#             religion, relation, hhid_parts (list), earn_regular, earn_casual, earn_self,
#             hours (single column or list of daily columns to sum), contract, paid_leave,
#             social_security, person_serial
# A list value for earn_* or hours means "sum these columns".

rounds:
  # 2017-18: verified against Data_LayoutPLFS and the data files (MoSPI CSV release).
  # Occupation/industry/earnings are from the CWS block (b6); contract, paid leave and
  # social security exist only for the usual principal activity (b5pt1).
  "2017-18":
    year: 2017
    occ_system: nco2004
    format: csv
    files: [data/raw/plfs/2017-18/data/per_fv_2017-18.csv]
    household:
      files: [data/raw/plfs/2017-18/data/hh_fv_2017-18.csv]
      keys: &hh_keys_fv {quarter_per_fv: qtr_hh_fv, fsu_per_fv: b1q1_hh_fv, b1q13_per_fv: b1q13_hh_fv, b1q14_per_fv: b1q14_hh_fv, b1q15_per_fv: b1q15_hh_fv}
      columns: &hh_cols_fv [b3q1_hh_fv, b3q2_hh_fv, b3q3_hh_fv, b3q4_hh_fv]   # hh size, hh type, religion, social group
    columns: &person_cols_2017   # same person-file columns in 2018-19
      quarter: quarter_per_fv
      visit: visit_per_fv
      sector: b1q3_per_fv
      state: state_per_fv
      district: b1q4_per_fv
      stratum: b1q5_per_fv
      fsu: fsu_per_fv
      hhid_parts: [quarter_per_fv, fsu_per_fv, b1q13_per_fv, b1q14_per_fv, b1q15_per_fv]
      relation: b4q4_per_fv
      sex: b4q5_per_fv
      age: b4q6_per_fv
      marital: b4q7_per_fv
      gen_edu: b4q8_per_fv
      religion: b3q3_hh_fv
      social_group: b3q4_hh_fv
      cws_status: b6q5_per_fv
      nic: b6q6_per_fv
      occ3: b6q7_per_fv
      earn_regular: b6q9_per_fv          # regular salaried/wage earnings, last calendar month
      earn_self: b6q10_per_fv            # self-employment gross earnings, last 30 days
      earn_casual: [b6q9_3pt1_Act1_per_fv, b6q9_3pt1_Act2_per_fv, b6q9_3pt2_Act1_per_fv, b6q9_3pt2_Act2_per_fv,
                    b6q9_3pt3_Act1_per_fv, b6q9_3pt3_Act2_per_fv, b6q9_3pt4_Act1_per_fv, b6q9_3pt4_Act2_per_fv,
                    b6q9_3pt5_Act1_per_fv, b6q9_3pt5_Act2, b6q9_3pt6_Act1, b6q9_Act2_3pt6,
                    b6q9_Act1_3pt7, b6q9_Act2_3pt7]          # daily wage earnings, 7 days x 2 activities
      hours: [b6q7_3pt1_per_fv, b6q7_3pt2_per_fv, b6q7_3pt3_per_fv, b6q7_3pt4_per_fv,
              b6q7_3pt5, b6q7_3pt6, b6q7_3pt7_per_fv]     # total hours actually worked, each day
      contract: b5pt1q11_per_fv
      paid_leave: b5pt1q12_per_fv
      social_security: b5pt1q13_per_fv
      mult: MULT_per_fv
      nss: NSS_per_fv
      nsc: NSC_per_fv
      no_qtr: No_qtr_per_fv
  # 2018-19: person columns identical to 2017-18. The first-visit household file
  # (records FVH1, visit V1) carries `_hh_rv` column suffixes in the MoSPI release.
  "2018-19":
    year: 2018
    occ_system: nco2004
    format: csv
    files: [data/raw/plfs/2018-19/data/per_fv_2018-19.csv]
    household:
      files: [data/raw/plfs/2018-19/data/hh_fv_2018-19.csv]
      keys: {quarter_per_fv: qtr_hh_rv, fsu_per_fv: b1q1_hh_rv, b1q13_per_fv: b1q13_hh_rv, b1q14_per_fv: b1q14_hh_rv, b1q15_per_fv: b1q15_hh_rv}
      columns: [b3q1_hh_rv, b3q2_hh_rv, b3q3_hh_rv, b3q4_hh_rv]
    columns:
      <<: *person_cols_2017
      religion: b3q3_hh_rv
      social_group: b3q4_hh_rv
  # 2019-20: person and household columns identical to 2017-18.
  "2019-20":
    year: 2019
    occ_system: nco2004
    format: csv
    files: [data/raw/plfs/2019-20/data/per_fv_2019-20.csv]
    household:
      files: [data/raw/plfs/2019-20/data/hh_fv_2019-20.csv]
      keys: *hh_keys_fv
      columns: *hh_cols_fv
    columns: *person_cols_2017
  # 2020-21: new schedule (migration block 7), columns renamed to *_perv1 / *_hhv1;
  # item positions unchanged. Occupation still NCO-2004. Quarters coded Q5-Q8.
  # Person serial >= 81 = temporary visitor (dropped, see codes.temporary_visitor_serial_min).
  "2020-21":
    year: 2020
    occ_system: nco2004
    format: csv
    files: [data/raw/plfs/2020-21/data/per_fv_2020-21.csv]
    household:
      files: [data/raw/plfs/2020-21/data/hh_fv_2020-21.csv]
      keys: &hh_keys_v1 {qtr_perv1: qtr_hhv1, b1q1_perv1: b1q1_hhv1, b1q13_perv1: b1q13_hhv1, b1q14_perv1: b1q14_hhv1, b1q15_perv1: b1q15_hhv1}
      columns: &hh_cols_v1 [b3q1_hhv1, b3q2_hhv1, b3q3_hhv1, b3q4_hhv1]
    columns: &person_cols_2020
      quarter: qtr_perv1
      visit: visit_perv1
      sector: b1q3_perv1
      state: state_perv1
      district: distcode_perv1
      stratum: b1q5_perv1
      fsu: b1q1_perv1
      hhid_parts: [qtr_perv1, b1q1_perv1, b1q13_perv1, b1q14_perv1, b1q15_perv1]
      person_serial: b4q1_perv1
      relation: b4q4_perv1
      sex: b4q5_perv1
      age: b4q6_perv1
      marital: b4q7_perv1
      gen_edu: b4q8_perv1
      religion: b3q3_hhv1
      social_group: b3q4_hhv1
      cws_status: b6q5_perv1
      nic: b6q6_perv1
      occ3: b6q7_perv1
      earn_regular: b6q9_perv1
      earn_self: b6q10_perv1
      earn_casual: [b6q9_3pt1_perv1, b6q9_3pt2_perv1, b6q9_3pt3_perv1, b6q9_3pt4_perv1, b6q9_3pt5_perv1, b6q9_3pt6_perv1, b6q9_3pt7_perv1, b6q9_act2_3pt1_perv1, b6q9_act2_3pt2_perv1, b6q9_act2_3pt3_perv1, b6q9_act2_3pt4_perv1, b6q9_act2_3pt5_perv1, b6q9_act2_3pt6_perv1, b6q9_act2_3pt7_perv1]
      hours: [b6q7_3pt1_perv1, b6q7_3pt2_perv1, b6q7_3pt3_perv1, b6q7_3pt4_perv1, b6q7_3pt5_perv1, b6q7_3pt6_perv1, b6q7_3pt7_perv1]
      contract: b5pt1q11_perv1
      paid_leave: b5pt1q12_perv1
      social_security: b5pt1q13_perv1
      mult: mult_perv1
      nss: NSS_perv1
      nsc: NSC_perv1
      no_qtr: no_qtr_perv1
  # 2021-22: first NCO-2015 round. Same *_perv1 naming as 2020-21, but block 5 has extra
  # items (q14-q16) and the daily hours/wage columns of activities 1 and 2 carry swapped
  # names in the release; earnings sum both activities, so the swap does not matter.
  # Codes come as floats ('611.0'); the loader normalises them.
  "2021-22":
    year: 2021
    occ_system: nco2015
    format: csv
    files: [data/raw/plfs/2021-22/data/per_fv_2021-22.csv]
    household:
      files: [data/raw/plfs/2021-22/data/hh_fv_2021-22.csv]
      keys: *hh_keys_v1
      columns: *hh_cols_v1
    columns: &person_cols_2021
      <<: *person_cols_2020
      earn_casual: [b6q9_act1_3pt1_perv1, b6q9_3pt1_perv1, b6q9_act2_3pt2_perv1, b6q9_3pt2_perv1, b6q9_act2_3pt3_perv1, b6q9_3pt3_perv1, b6q9_act2_3pt4_perv1, b6q9_3pt4_perv1, b6q9_act2_3pt5_perv1, b6q9_3pt5_perv1, b6q9_act2_3pt6_perv1, b6q9_3pt6_perv1, b6q9_act2_3pt7_perv1, b6q9_3pt7_perv1]
  # 2022-23: person columns named as in 2020-21 (no migration block). Quarters Q5-Q8.
  # MoSPI note: one Assam village carries a very large (correct) multiplier; compare
  # weighted and unweighted estimates for this round.
  "2022-23":
    year: 2022
    occ_system: nco2015
    format: csv
    files: [data/raw/plfs/2022-23/data/per_fv_2022-23.csv]
    household:
      files: [data/raw/plfs/2022-23/data/hh_fv_2022-23.csv]
      keys: *hh_keys_v1
      columns: *hh_cols_v1
    columns: *person_cols_2020
  # 2023-24: identical file layout to 2022-23.
  "2023-24":
    year: 2023
    occ_system: nco2015
    format: csv
    files: [data/raw/plfs/2023-24/data/per_fv_2023-24.csv]
    household:
      files: [data/raw/plfs/2023-24/data/hh_fv_2023-24.csv]
      keys: *hh_keys_v1
      columns: *hh_cols_v1
    columns: *person_cols_2020

# Supported formats: csv, tsv, parquet, dta, fwf. For fwf give `layout: <csv with name,start,width>`
# (start is 1-based, as in the MoSPI data layout sheets).
#
# Household file: religion, social group etc. are in the first-visit household file.
# Add to a round:
#   household:
#     files: [data/raw/plfs/2017-18/hh_fv.txt]
#     layout: data/raw/plfs/2017-18/hh_layout.csv     # if fwf
#     keys: [<raw cols identifying a household, present in both files, e.g. FSU, hamlet group/sub-block, second-stage stratum, sample household no.>]
#     columns: [<raw household columns to bring over, e.g. religion, social group>]
# then refer to those raw names in `columns` as usual (e.g. religion: <raw name>).
# Download per round: first-visit person file, first-visit household file, data layout,
# instruction manual. Annual July-June rounds only (calendar-year files repeat the same interviews).

codes:
  sector: {rural: 1, urban: 2}
  sex: {male: 1, female: 2}
  status:                       # current weekly status (CWS) activity codes
    self_employed: [11, 12, 21]
    regular: [31]
    casual: [41, 42, 51]
    unemployed: [81, 82]
  gen_edu:                      # general education level -> category
    illiterate: [1]
    below_primary: [2, 3, 4, 5]
    primary: [6]
    middle: [7]
    secondary: [8]
    higher_secondary: [10]
    diploma: [11]
    graduate: [12]
    postgraduate: [13]
  edu_band:                     # coarser bands for heterogeneity
    up_to_primary: [illiterate, below_primary, primary]
    middle_secondary: [middle, secondary, higher_secondary]
    tertiary: [diploma, graduate, postgraduate]
  marital: {currently_married: [2]}
  relation: {head: [1]}
  contract_written: [2, 3, 4]   # type of job contract: 1 = no written contract
  paid_leave_yes: [1]
  social_security_yes: [1, 2, 3, 4, 5, 6, 7]   # 8 = not eligible, 9 = don't know
  temporary_visitor_serial_min: 81             # person serial >= 81: temporary visitor (2020-21 onward)

weights:
  rule: plfs_annual             # (mult/100 if nss == nsc else mult/200) / no_qtr  — PLFS README; `plfs_quarterly` skips /no_qtr

deflator:
  path: data/raw/cpi.csv        # optional: columns state, sector, year, cpi (any base); nominal if absent
  base_year: 2023

wages:
  weeks_per_month: 4.33         # monthly <-> weekly for regular earnings
  self_days: 30                 # self-employment earnings reference period (days)
  trim_pct: [0.5, 99.5]         # drop hourly-wage outliers within each round
