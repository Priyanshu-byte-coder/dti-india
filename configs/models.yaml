# LLM scoring configuration.
#
# Every model is reached through an OpenAI-compatible chat endpoint. On the Nirma
# GPU server, `scripts/run_scoring.sh` starts vLLM, scores, and stops it. Hosted APIs
# work the same way (set base_url + api_key_env).
#
# Rough bf16 memory needs: 7-9B ~ 18 GB, 27-32B ~ 65 GB, 70B ~ 140 GB.
# Choice (decisions.md, item 3), by total GPU memory on the Nirma server:
#   >= 80 GB : qwen32b + llama8b   (main pair)
#   24-79 GB : qwen7b  + llama8b   (one model at a time; same two families)
# Two families either way, so cross-model agreement (RQ1) is always available.
# The abstract asks for intra-model stability; the plan adds a second model
# family for cross-model agreement.

defaults:
  runs: 5                 # repeated scoring runs per occupation (seeds 0..runs-1)
  temperature: 0.7        # >0 so repeated runs can disagree; see README "Stability runs"
  top_p: 0.95
  max_tokens: 1500
  concurrency: 16         # parallel requests to the endpoint
  max_attempts: 3         # retries on API / JSON / validation errors
  structured_output: json_schema   # json_schema | json_object | none

models:
  qwen32b:
    model: Qwen/Qwen2.5-32B-Instruct
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY

  qwen7b:
    model: Qwen/Qwen2.5-7B-Instruct
    base_url: http://localhost:8002/v1
    api_key_env: VLLM_API_KEY

  llama8b:     # gated: accept the licence on huggingface.co, then `huggingface-cli login`
    model: meta-llama/Llama-3.1-8B-Instruct
    base_url: http://localhost:8001/v1
    api_key_env: VLLM_API_KEY

  # Deterministic keyword stand-in for testing the pipeline without a GPU.
  # Never use its output as research data.
  mock:
    backend: mock
    model: keyword-mock
